id = "znd4.thumbs"
name = "Thumbs"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "tmux-thumbs for herdr: hint-label matches in a pane, then copy or open them"
platforms = ["linux", "macos"]

# The overlay itself. `overlay` opens a temporary zoomed pane over the active
# one and restores the previous focus + zoom when it closes — the tmux-thumbs
# UX. (Newer herdr also has a session-modal `popup` placement; this version
# validates only overlay/split/tab/zoomed, and overlay is the right fit.)
[[panes]]
id = "pick"
title = "Thumbs"
placement = "overlay"
command = ["./thumbs.py"]

# Keybindings can only bind command types `shell`, `pane`, or `plugin_action`
# (verified against herdr 0.7.1 — there is no `plugin_pane` bind type). So the
# key-launch path is this action, which opens the overlay pane via the CLI.
# Bind it in config.toml with:
#   [[keys.command]]
#   key = "prefix+space"
#   type = "plugin_action"
#   command = "znd4.thumbs.launch"
[[actions]]
id = "launch"
title = "Thumbs: hint + copy/open"
contexts = ["workspace", "pane"]
command = ["./launch.sh"]
